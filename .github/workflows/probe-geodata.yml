# Diagnostic, manual only: can the Bavarian open geodata portal be downloaded from without
# an account, and what does it offer for Munich (LoD2 buildings, surface model)?
# Prints findings to the job log and step summary. Changes nothing in the repo.
name: probe-geodata

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import re, json, urllib.request, urllib.error, os
          UA = {"User-Agent": "geodata-probe/0.2"}
          out = []
          def say(s=""):
              print(s); out.append(s)
          def get(url, n=None):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                      return r.status, (r.read(n) if n else r.read())
              except urllib.error.HTTPError as e:
                  return e.code, e.read(500)
              except Exception as e:
                  return None, str(e).encode()
          BASE = "https://geodaten.bayern.de/opengeodata/"

          say("## 1. Where the start page says 'Anmeldung'")
          st, b = get(BASE)
          t = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", b.decode("utf-8", "replace")))
          for m in re.finditer(r"(?i)anmeld\w*|registrier\w*|login", t):
              say("- ..." + t[max(0, m.start() - 140): m.end() + 140] + "...")

          say("\n## 2. Product catalogue (json/opengeodata_datensaetze.json)")
          st, b = get(BASE + "json/opengeodata_datensaetze.json")
          say(f"- HTTP {st}, {len(b)} bytes")
          cat = json.loads(b.decode("utf-8", "replace"))
          items = cat if isinstance(cat, list) else next((v for v in cat.values() if isinstance(v, list)), [cat])
          say(f"- top level: {type(cat).__name__}, entries: {len(items)}")
          if items and isinstance(items[0], dict):
              say(f"- keys of an entry: {sorted(items[0].keys())}")
          def flat(d):
              return json.dumps(d, ensure_ascii=False)
          say("- all products (id | name):")
          for it in items:
              if not isinstance(it, dict): continue
              ident = next((str(it[k]) for k in ("pn", "id", "kuerzel", "key", "produkt") if k in it), "?")
              name = next((str(it[k]) for k in ("titel", "title", "name", "bezeichnung") if k in it), "?")
              say(f"  - {ident} | {name}")
          lic = sorted(set(re.findall(r"(?i)CC[ -]BY[A-Z\- ]{0,6}4\.0|creativecommons\.org/licenses/[a-z\-]+/[0-9.]+|Datenlizenz[^\"<]{0,60}", flat(cat))))
          say(f"- licence strings in catalogue: {lic}")
          say("\n### Entries about buildings, surface and terrain models")
          for it in items:
              s = flat(it)
              if re.search(r"(?i)lod2|oberfl|\bdom|dgm|gel.ndemodell|laser", s):
                  for k, v in (it.items() if isinstance(it, dict) else []):
                      vs = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", flat(v)))
                      say(f"  {k}: {vs[:420]}")
                  say("  ---")

          say("\n## 3. Size of the Munich downloads (from the metalinks, AGS 09162000)")
          def metalink(path):
              st, b = get(f"https://geodaten.bayern.de/odd/a/{path}/meta/metalink/09162000.meta4")
              if st != 200: return st, 0, 0, []
              x = b.decode("utf-8", "replace")
              sizes = [int(s) for s in re.findall(r"<size>(\d+)</size>", x)]
              return st, len(re.findall(r"<file ", x)), sum(sizes), re.findall(r"<url[^>]*>([^<]+)</url>", x)[:1]
          cands = ["lod2/citygml", "dgm/dgm1", "dgm/dgm5", "dom20/DOM", "dom/dom20", "dom/dom1", "dom20", "dom40/DOM", "dom40", "bdom20", "dom/bdom20", "laser/las", "laser"]
          # also try every path that the catalogue itself mentions
          cands += sorted(set(re.findall(r"odd/a/([A-Za-z0-9_/]+?)/meta/metalink", flat(cat))))
          seen = set()
          for c in cands:
              if c in seen: continue
              seen.add(c)
              st, n, total, first = metalink(c)
              say(f"- {c}: HTTP {st}" + (f", {n} files, {total/1e9:.1f} GB, e.g. {first}" if st == 200 else ""))

          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write("\n".join(out) + "\n")
          PY
