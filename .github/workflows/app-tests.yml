# Runs the pure-JVM module tests (:core-solar, later :core-engine) on every push that
# touches app/. No Android SDK needed for these.
name: app-tests

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app-tests.yml"
  workflow_dispatch:

jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core-solar:test :core-engine:test --no-daemon
      - name: Test report
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("## JVM tests\n\n| suite | tests | failures | errors |\n|---|---|---|---|")
          for f in sorted(glob.glob("*/build/test-results/test/*.xml")):
              r = ET.parse(f).getroot()
              print(f"| {r.get('name')} | {r.get('tests')} | {r.get('failures')} | {r.get('errors')} |")
          PY
