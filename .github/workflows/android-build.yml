# Builds the debug APK (sideload it from the run's artifacts) and runs the :app unit tests.
name: android-build

on:
  push:
    paths:
      - "app/**"
      - "data/sightlines.json"
      - "data/pois.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (:app)
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: munichhenge-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Signed release APK, only when the signing secrets exist (see create-keystore.yml)
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret: skipping the signed release APK." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Assemble signed release APK
        if: steps.keystore.outputs.present == 'true'
        env:
          MUNICHHENGE_KEYSTORE: ${{ runner.temp }}/release.jks
          MUNICHHENGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MUNICHHENGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MUNICHHENGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.present == 'true'
        with:
          name: munichhenge-release-apk
          path: app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Test report
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("## :app unit tests\n\n| suite | tests | failures | errors |\n|---|---|---|---|")
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              print(f"| {r.get('name')} | {r.get('tests')} | {r.get('failures')} | {r.get('errors')} |")
          print("\nAPK: see the run's artifacts (munichhenge-debug-apk).")
          PY
