# One-off: generates a release signing keystore that YOU own. Run it once from the Actions
# tab, download the "release-keystore" artifact (visible only to repository collaborators,
# kept 7 days), keep the .jks somewhere safe, and add four repository secrets from
# keystore-info.txt: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# android-build then signs the release APK. Losing the keystore means future builds cannot
# update an installed release APK, so back it up.
name: create-keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate keystore
        run: |
          set -euo pipefail
          mkdir -p out
          PW="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
          ALIAS=munichhenge
          keytool -genkeypair -v -keystore out/munichhenge-release.jks -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" \
            -dname "CN=munichhenge, OU=personal, O=munichhenge, L=Munich, C=DE" > /dev/null 2>&1
          {
            echo "Add these as repository secrets (Settings -> Secrets and variables -> Actions):"
            echo
            echo "KEY_ALIAS=$ALIAS"
            echo "KEYSTORE_PASSWORD=$PW"
            echo "KEY_PASSWORD=$PW"
            echo "KEYSTORE_BASE64=$(base64 -w0 out/munichhenge-release.jks)"
          } > out/keystore-info.txt
          echo "Keystore generated. Download the artifact; nothing secret is printed here." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: out/
          retention-days: 7
          if-no-files-found: error
